<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parcours des tirs Mbappé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Arvo:wght@400;700&display=block" rel="stylesheet">
<style>
:root {
  --paper: #ebe7de; --grid: rgba(120,110,95,.10); --ink: #1d1b19; --muted: #6f6a62;
  --made: #5470c8; --miss: #cf6266; --label: rgba(246,243,236,.88);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Arvo', Rockwell, Georgia, serif; }
.scroller { overflow-x: auto; overflow-y: hidden; }
.paper {
  width: 2960px; position: relative;
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 40px 40px;
}
header { position: absolute; left: 0; right: 0; top: 0; height: 460px; }
h1 { position: absolute; left: 260px; top: 60px; margin: 0; font-size: 58px; line-height: 1.02; font-weight: 700; letter-spacing: -.5px;
     text-shadow: 2px 2px 0 rgba(0,0,0,.08); }
.sub { position: absolute; left: 262px; top: 196px; font-size: 19px; color: var(--muted); }
.photo { position: absolute; right: 130px; top: 22px; width: 290px; height: 290px; border: 4px solid #c2393f; background: #f6f3ec;
         box-shadow: 4px 4px 0 rgba(0,0,0,.12); overflow: hidden; }
.photo img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
.filters { position: absolute; left: 262px; top: 238px; display: flex; gap: 22px; font-size: 14px; }
.filters .grp { display: flex; gap: 6px; align-items: center; }
.filters .grp span { color: var(--muted); margin-right: 4px; }
.filters button { font: inherit; font-size: 13px; border: 1.5px solid var(--ink); background: transparent; color: var(--ink);
                  padding: 4px 10px; cursor: pointer; border-radius: 2px; }
.filters button.on { background: var(--ink); color: var(--paper); }
.render .filters { display: none; }
svg { display: block; }
.node-label rect { fill: var(--label); }
.node-label .n { font-weight: 700; font-size: 19px; fill: var(--ink); }
.node-label .c { font-size: 13px; fill: #4a463f; }
.node-label .g { font-size: 12.5px; fill: #3d58a8; }
.node-label .m { font-size: 12.5px; fill: #b0353b; }
.axis { font-weight: 700; font-size: 26px; fill: #3b3833; letter-spacing: 1px; text-shadow: 1px 1px 0 rgba(0,0,0,.08); }
.link { mix-blend-mode: multiply; transition: opacity .15s; }
.dim .link { opacity: .12 !important; }
.dim .link.hot { opacity: .95 !important; }
.tip { position: fixed; pointer-events: none; background: #1d1b19; color: #f3efe6; font-size: 13px; padding: 8px 10px; border-radius: 3px;
       line-height: 1.45; opacity: 0; transition: opacity .1s; max-width: 280px; z-index: 5; }
.tip b { font-size: 14px; }
</style>
</head>
<body>
<div class="scroller">
  <div class="paper" id="paper">
    <header>
      <h1>Kylian Mbappé,<br>le parcours de ses tirs</h1>
      <div class="sub" id="sub"></div>
      <div class="filters" id="filters"></div>
      <div class="photo"><img src="__PHOTO__" alt="Kylian Mbappé"></div>
    </header>
    <svg id="flow" width="2960" height="1660"></svg>
  </div>
</div>
<div class="tip" id="tip"></div>
<script>
const SHOTS = /*__SHOTS__*/[];
const RENDER = new URLSearchParams(location.search).has('render');
if (RENDER) document.body.classList.add('render');

const W = 2960, TOP = 490, H = 1000, GAP = 34, BAR = 10;
const COLS = [260, 660, 1060, 1460, 1900, 2300, 2700];      // espace élargi avant le zoom sur les buts
const STAGES = [
  { key: 'zone', title: 'ZONE', order: ['Surface de but', 'Surface · axe', 'Surface · gauche', 'Surface · droite', 'Point de penalty', 'Hors surface'] },
  { key: 'sit',  title: 'SITUATION', order: ['Jeu placé', 'Contre-attaque', 'Penalty', 'Corner', 'Coup franc direct', 'Autre CPA', 'Action individuelle'] },
  { key: 'body', title: 'SURFACE', order: ['Pied droit', 'Pied gauche', 'Tête'] },
  { key: 'res',  title: 'RÉSULTAT', order: ['But', 'Raté'] },
  { key: 'pass', title: 'PASSEUR', goalsOnly: true, order: null },
  { key: 'how',  title: 'COMMENT IL A MARQUÉ', goalsOnly: true, order: ['Pied droit', 'Pied gauche', 'Tête'] },
  { key: 'phase', title: 'PHASE DU BUT', goalsOnly: true, order: ['Jeu placé', 'Contre-attaque', 'Penalty', 'Corner', 'Coup franc direct', 'Autre CPA', 'Action individuelle'] },
];
const SEASONS = [['all', 'Tout'], ['2024-2025', '2024-25'], ['2025-2026', '2025-26'], ['2026-2027', '2026-27']];
const COMPS = [['all', 'Toutes'], ['laliga', 'Liga'], ['champions-league', 'Ligue des champions']];
const state = { season: 'all', comp: 'all' };
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('flow'), tip = document.getElementById('tip');
const pct = (n, t) => t ? Math.round(100 * n / t) + '%' : '–';
const plural = (n, w) => `${n} ${w}${n > 1 ? 's' : ''}`;

function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}

function filters() {
  const box = document.getElementById('filters');
  const grp = (label, opts, key) => {
    const g = document.createElement('div'); g.className = 'grp';
    g.innerHTML = `<span>${label}</span>`;
    for (const [v, t] of opts) {
      const b = document.createElement('button'); b.textContent = t; b.className = state[key] === v ? 'on' : '';
      b.onclick = () => { state[key] = v; box.innerHTML = ''; filters(); draw(); };
      g.appendChild(b);
    }
    box.appendChild(g);
  };
  grp('Saison', SEASONS, 'season'); grp('Compétition', COMPS, 'comp');
}

function prepare() {
  const shots = SHOTS.filter(s => (state.season === 'all' || s.season === state.season) && (state.comp === 'all' || s.comp === state.comp))
                     .map(s => ({ ...s, res: s.goal ? 'But' : 'Raté', how: s.goal ? s.body : null, phase: s.goal ? s.sit : null, pass: null }));
  // passeurs des buts : les 7 plus fréquents, le reste en « Autres », sans passe en tête comme « Unassisted »
  const goals = shots.filter(s => s.goal), count = {};
  goals.forEach(s => { if (s.ast) count[s.ast] = (count[s.ast] || 0) + 1; });
  const top = Object.keys(count).sort((a, b) => count[b] - count[a] || a.localeCompare(b)).slice(0, 7);
  goals.forEach(s => { s.pass = !s.ast ? 'Sans passeur' : top.includes(s.ast) ? s.ast : 'Autres'; });
  STAGES[4].order = ['Sans passeur', ...top, 'Autres'];
  return shots;
}

function layout(shots) {
  const N = shots.length, G = shots.filter(s => s.goal).length;
  STAGES.forEach((st, i) => {
    const pool = st.goalsOnly ? shots.filter(s => s.goal) : shots;
    st.x = COLS[i];
    st.total = pool.length;
    st.nodes = st.order.map(name => ({ name, shots: pool.filter(s => s[st.key] === name) })).filter(n => n.shots.length);
    st.nodes.forEach((n, j) => { n.idx = j; n.stage = i; n.goals = n.shots.filter(s => s.goal).length; });
  });
  // une échelle pour les tirs, une autre (zoom) pour les buts
  const scale = group => Math.min(...group.map(st => (H - GAP * (st.nodes.length - 1)) / Math.max(st.total, 1)));
  const k1 = scale(STAGES.filter(s => !s.goalsOnly)), k2 = G ? scale(STAGES.filter(s => s.goalsOnly)) : 0;
  STAGES.forEach(st => {
    st.k = st.goalsOnly ? k2 : k1;
    const span = st.total * st.k + GAP * (st.nodes.length - 1);
    let y = TOP + (H - span) / 2;
    st.nodes.forEach(n => { n.y = y; n.h = n.shots.length * st.k; y += n.h + GAP; });
  });
  // liens : groupés par (source, cible, but/raté)
  const links = [];
  for (let i = 0; i < STAGES.length - 1; i++) {
    const a = STAGES[i], b = STAGES[i + 1], map = new Map();
    const nodeOf = (st, s) => st.nodes.find(n => n.name === s[st.key]);
    for (const s of shots) {
      if (b.goalsOnly && !s.goal) continue;
      const src = nodeOf(a, s), tgt = nodeOf(b, s), key = `${src.idx}|${tgt.idx}|${s.goal}`;
      if (!map.has(key)) map.set(key, { src, tgt, goal: s.goal, shots: [], a, b });
      map.get(key).shots.push(s);
    }
    const ls = [...map.values()];
    // sortie : buts au-dessus puis ordre des cibles ; entrée : buts au-dessus puis ordre des sources (rayures du visuel basket)
    for (const n of a.nodes) {
      let y = n.y;
      ls.filter(l => l.src === n).sort((p, q) => q.goal - p.goal || p.tgt.idx - q.tgt.idx).forEach(l => { l.sy = y; l.sw = l.shots.length * a.k; y += l.sw; });
    }
    for (const n of b.nodes) {
      let y = n.y;
      ls.filter(l => l.tgt === n).sort((p, q) => q.goal - p.goal || p.src.idx - q.src.idx).forEach(l => { l.ty = y; l.tw = l.shots.length * b.k; y += l.tw; });
    }
    links.push(...ls);
  }
  return { N, G, links };
}

function band(x0, y0, w0, x1, y1, w1) {
  const m = (x0 + x1) / 2;
  return `M${x0},${y0} C${m},${y0} ${m},${y1} ${x1},${y1} L${x1},${y1 + w1} C${m},${y1 + w1} ${m},${y0 + w0} ${x0},${y0 + w0} Z`;
}

function showTip(ev, html) { tip.innerHTML = html; tip.style.opacity = 1; moveTip(ev); }
function moveTip(ev) {
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.min(ev.clientX + 14, innerWidth - r.width - 8) + 'px';
  tip.style.top = Math.min(ev.clientY + 14, innerHeight - r.height - 8) + 'px';
}
function hideTip() { tip.style.opacity = 0; }

function hover(elm, html, group, links) {
  if (RENDER) return;
  elm.addEventListener('mouseenter', ev => { svg.classList.add('dim'); links.forEach(l => l.el && l.el.classList.add('hot')); showTip(ev, html); });
  elm.addEventListener('mousemove', moveTip);
  elm.addEventListener('mouseleave', () => { svg.classList.remove('dim'); links.forEach(l => l.el && l.el.classList.remove('hot')); hideTip(); });
}

function label(parent, x, yc, anchor, lines) {
  const g = el('g', { class: 'node-label' }, parent);
  const bg = el('rect', {}, g);
  let y = 0;
  lines.forEach(([cls, txt], i) => {
    const t = el('text', { class: cls, x, 'text-anchor': anchor }, g);
    y += i === 0 ? 0 : (cls === 'c' ? 16 : 15);
    t.setAttribute('y', y); t.textContent = txt;
  });
  const bb = g.getBBox();
  bg.setAttribute('x', bb.x - 6); bg.setAttribute('y', bb.y - 3); bg.setAttribute('width', bb.width + 12); bg.setAttribute('height', bb.height + 6);
  return { g, off: bb.y, h: bb.height + 6, top: yc - bb.height / 2 - 3 };
}

// étiquettes d'une colonne : on les écarte quand les petits noeuds sont trop proches
function place(labels) {
  labels.sort((a, b) => a.top - b.top);
  for (let i = 1; i < labels.length; i++) labels[i].top = Math.max(labels[i].top, labels[i - 1].top + labels[i - 1].h + 3);
  const last = labels.length - 1, over = last >= 0 ? labels[last].top + labels[last].h - (TOP + H + 30) : 0;
  if (over > 0) {
    labels[last].top -= over;
    for (let i = last - 1; i >= 0; i--) labels[i].top = Math.min(labels[i].top, labels[i + 1].top - labels[i].h - 3);
  }
  labels.forEach(l => l.g.setAttribute('transform', `translate(0,${l.top + 3 - l.off})`));
}

function draw() {
  const shots = prepare();
  const { N, G, links } = layout(shots);
  svg.innerHTML = '';
  const seasonTxt = state.season === 'all' ? '2024-25 → 2026-27' : SEASONS.find(s => s[0] === state.season)[1];
  const compTxt = state.comp === 'all' ? 'Liga + Ligue des champions' : COMPS.find(c => c[0] === state.comp)[1];
  document.getElementById('sub').textContent = `Real Madrid · ${compTxt} · ${seasonTxt} · ${N} tirs, ${G} buts (${pct(G, N)})`;

  const gl = el('g', {}, svg), gn = el('g', {}, svg), gt = el('g', {}, svg);
  const color = goal => goal ? 'var(--made)' : 'var(--miss)';

  // amorces à gauche de la première colonne (rouge au-dessus, bleu dessous)
  const s0 = STAGES[0];
  for (const n of s0.nodes) {
    const hg = n.goals * s0.k;
    el('rect', { class: 'link', x: 0, y: n.y, width: s0.x, height: hg, fill: color(1), opacity: .85 }, gl);
    el('rect', { class: 'link', x: 0, y: n.y + hg, width: s0.x, height: n.h - hg, fill: color(0), opacity: .85 }, gl);
  }
  for (const l of links) {
    const p = el('path', { class: 'link', d: band(l.a.x, l.sy, l.sw, l.b.x, l.ty, l.tw), fill: color(l.goal), opacity: .72 }, gl);
    l.el = p;
    const n = l.shots.length;
    hover(p, `<b>${l.src.name} → ${l.tgt.name}</b><br>${plural(n, l.goal ? 'but' : 'tir raté')}` +
             (l.b.goalsOnly ? `<br>${pct(n, G)} des buts` : `<br>${pct(n, N)} des tirs`), gl, [l]);
  }
  // amorces à droite de la dernière colonne
  const sl = STAGES[STAGES.length - 1];
  for (const n of sl.nodes) el('rect', { class: 'link', x: sl.x, y: n.y, width: W - sl.x, height: n.h, fill: color(1), opacity: .85 }, gl);

  // noeuds + étiquettes
  STAGES.forEach((st, i) => {
    const placed = [];
    for (const n of st.nodes) {
      const bar = el('rect', { x: st.x - BAR / 2, y: n.y, width: BAR, height: Math.max(n.h, 1.5), fill: '#151413' }, gn);
      const tot = n.shots.length, base = st.goalsOnly ? G : N;
      const lines = [['n', n.name], ['c', `${tot}  (${pct(tot, base)}${st.goalsOnly ? ' des buts' : ''})`]];
      if (st.key === 'res' && n.name === 'Raté') {
        const t = k => n.shots.filter(s => s.type === k).length;
        lines.push(['m', `${t('Arrêté')} arrêtés · ${t('Hors cadre')} hors cadre · ${t('Poteau')} poteaux`]);
      } else if (st.key === 'res') {
        const xg = n.shots.reduce((a, s) => a + (s.xg || 0), 0), xgAll = shots.reduce((a, s) => a + (s.xg || 0), 0);
        lines.push(['g', `xG cumulé ${xgAll.toFixed(1)} → ${G - xgAll >= 0 ? '+' : ''}${(G - xgAll).toFixed(1)} buts au-dessus`]);
      } else if (st.key === 'phase') {
        const all = shots.filter(s => s.sit === n.name).length;
        lines.push(['g', `sur ${all} tirs · ${pct(tot, all)} de réussite`]);
      } else if (st.key === 'how') {
        lines.push(['g', `dont ${n.shots.filter(s => s.ftouch).length} en une touche`]);
      } else if (st.key === 'pass') {
        // rien de plus : la bande dit déjà tout
      } else {
        lines.push(['g', `${plural(n.goals, 'but')} · ${pct(n.goals, tot)} de réussite`]);
      }
      const left = i === 0;
      placed.push(label(gt, left ? st.x - 16 : st.x + 16, n.y + n.h / 2, left ? 'end' : 'start', lines));
      const nodeLinks = links.filter(l => l.src === n || l.tgt === n);
      hover(bar, `<b>${n.name}</b><br>${tot} ${st.goalsOnly ? 'buts' : 'tirs'}`, gn, nodeLinks);
    }
    place(placed);
    const ax = el('text', { class: 'axis', x: st.x, y: TOP + H + 70, 'text-anchor': 'middle' }, gt);
    ax.textContent = st.title;
  });
  // annotation du zoom
  const zx = (COLS[3] + COLS[4]) / 2;
  const z = el('text', { x: zx, y: TOP - 18, 'text-anchor': 'middle', 'font-size': 15, fill: '#3d58a8', 'font-style': 'italic' }, gt);
  z.textContent = `zoom ×${(STAGES[4].k / STAGES[3].k || 0).toFixed(1)} sur les ${G} buts →`;

  pitch(shots);

  // légende
  const lg = el('g', { transform: `translate(${W / 2 - 150},${TOP + H + 135})` }, gt);
  [['Made', 'But', 1], ['Missed', 'Raté', 0]].forEach(([, t, gl_], j) => {
    el('rect', { x: j * 170, y: -14, width: 34, height: 18, fill: color(gl_) }, lg);
    const tx = el('text', { x: j * 170 + 46, y: 1, 'font-size': 22, fill: '#3b3833' }, lg); tx.textContent = t;
  });
  const src = el('text', { x: W - 40, y: TOP + H + 135, 'text-anchor': 'end', 'font-size': 13, fill: 'var(--muted)' }, gt);
  src.textContent = 'Données : WhoScored × FotMob · zones recalculées depuis x/y · passeur = joueur associé au tir';
}

// demi-terrain (but en haut, gauche de l'attaquant à gauche) : rappelle d'où viennent les zones
function pitch(shots) {
  const K = 12, X0 = 1290, Y0 = 30, XMIN = 72;
  const sx = y => X0 + (68 - y) * K, sy = x => Y0 + (105 - x) * K;
  const g = el('g', {}, svg);
  const rect = (x0, x1, y0, y1, attrs) => el('rect', { x: sx(y1), y: sy(x1), width: (y1 - y0) * K, height: (x1 - x0) * K, ...attrs }, g);
  const BX = 87.15, SX = 98.9, BY = [14.35, 53.65], SY = [25, 43];
  rect(XMIN, 105, 0, 68, { fill: 'rgba(255,255,255,.35)', stroke: '#3b3833', 'stroke-width': 1.5 });
  const zfill = { 'Surface de but': [SX, 105, SY[0], SY[1]], 'Surface · axe': [BX, SX, SY[0], SY[1]],
                  'Surface · gauche': [BX, 105, SY[1], BY[1]], 'Surface · droite': [BX, 105, BY[0], SY[0]] };
  const tot = {};
  shots.forEach(s => { tot[s.zone] = tot[s.zone] || [0, 0]; tot[s.zone][0]++; tot[s.zone][1] += s.goal; });
  for (const [z, [x0, x1, y0, y1]] of Object.entries(zfill)) rect(x0, x1, y0, y1, { fill: 'rgba(29,27,25,.05)', stroke: '#3b3833', 'stroke-width': 1.2, 'stroke-dasharray': z === 'Surface de but' ? '' : '4 3' });
  rect(BX, 105, BY[0], BY[1], { fill: 'none', stroke: '#3b3833', 'stroke-width': 1.5 });
  rect(105, 105 + 2.2, 30.34, 37.66, { fill: '#3b3833' });
  el('circle', { cx: sx(34), cy: sy(92.925), r: 4, fill: '#3b3833' }, g);
  el('path', { d: `M${sx(34 + 9.15 * .6)},${sy(BX)} A${9.15 * K},${9.15 * K} 0 0 0 ${sx(34 - 9.15 * .6)},${sy(BX)}`, fill: 'none', stroke: '#3b3833', 'stroke-width': 1.5 }, g);
  for (const s of shots.filter(s => s.zone !== 'Point de penalty').sort((a, b) => a.goal - b.goal))
    if (s.x >= XMIN) el('circle', { cx: sx(s.y), cy: sy(s.x), r: s.goal ? 5.5 : 4, fill: s.goal ? 'var(--made)' : 'var(--miss)', opacity: s.goal ? .95 : .55 }, g);
  // étiquette sur le côté, reliée au centre de la zone
  const tag = (z, side, ty, cx, cy) => {
    if (!tot[z]) return;
    const x = side < 0 ? sx(68) - 14 : sx(0) + 14;
    el('path', { d: `M${x + (side < 0 ? 4 : -4)},${ty - 4} L${sx(cy)},${sy(cx)}`, stroke: '#3b3833', 'stroke-width': .8, fill: 'none', opacity: .6 }, g);
    el('circle', { cx: sx(cy), cy: sy(cx), r: 3, fill: '#3b3833' }, g);
    const t = el('text', { x, y: ty, 'text-anchor': side < 0 ? 'end' : 'start', 'font-size': 17, fill: '#3b3833' }, g);
    const a = el('tspan', { 'font-weight': 700 }, t); a.textContent = z + '  ';
    const b = el('tspan', { fill: '#3d58a8' }, t); b.textContent = `${tot[z][0]} tirs · ${plural(tot[z][1], 'but')}`;
  };
  tag('Surface de but', -1, Y0 + 60, 102, 38);
  tag('Surface · gauche', -1, Y0 + 160, 95, 50);
  tag('Surface · axe', -1, Y0 + 260, 92, 30);
  tag('Surface · droite', 1, Y0 + 110, 95, 18);
  tag('Point de penalty', 1, Y0 + 210, 92.925, 34);
  tag('Hors surface', 1, Y0 + 340, 80, 22);
}

filters();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { draw(); window.__ready = true; });
</script>
</body>
</html>
